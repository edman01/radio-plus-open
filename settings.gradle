pluginManagement {
    repositories {
        def localMaven = System.getenv("RADIO_PLUS_LOCAL_MAVEN")
        if (localMaven) {
            maven { url = uri(localMaven) }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def localMaven = System.getenv("RADIO_PLUS_LOCAL_MAVEN")
        if (localMaven) {
            maven { url = uri(localMaven) }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "RadioPlus"
include(":app")
