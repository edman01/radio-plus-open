// Optional label for the V7 steering-route retest. Normal builds are unchanged.
beforeProject { project ->
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            if (project.findProperty('experimentalTestBuild6') != 'true') {
                throw new GradleException('Test Build 12 requires -PexperimentalTestBuild6=true')
            }
            project.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                dsl.defaultConfig.versionCode = 113
                dsl.defaultConfig.versionName = '0.16.1-experimental-testbuild12'
            }
        }
    }
}
