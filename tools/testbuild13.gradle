// Optional label for the automatic V7 wheel recovery / settings header retest.
beforeProject { project ->
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            if (project.findProperty('experimentalTestBuild6') != 'true') {
                throw new GradleException('Test Build 13 requires -PexperimentalTestBuild6=true')
            }
            project.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                dsl.defaultConfig.versionCode = 114
                dsl.defaultConfig.versionName = '0.16.1-experimental-testbuild13'
            }
        }
    }
}
